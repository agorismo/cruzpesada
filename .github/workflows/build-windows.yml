# Compila o AstraScreenShare no Windows do GitHub e publica o instalador.
# Dispara a cada push, ou manualmente em Actions > "Build Windows" > Run workflow.
name: Build Windows

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar o Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Compilar o ajudante (astra-audio.exe)
        shell: pwsh
        working-directory: astra-helper
        run: cargo build --release

      - name: Colocar o ajudante nos recursos do programa
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/resources | Out-Null
          Copy-Item astra-helper/target/release/astra-audio.exe src-tauri/resources/ -Force

      - name: Gerar os ícones
        shell: pwsh
        working-directory: src-tauri
        run: |
          if (-not (Test-Path icons/icon.ico)) { cargo tauri icon ../web/icone-512.png }

      - name: Gerar o instalador
        shell: pwsh
        working-directory: src-tauri
        run: cargo tauri build

      - name: Publicar o instalador
        uses: actions/upload-artifact@v4
        with:
          name: AstraScreenShare-instalador
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
