[package]
name = "astra-helper"
version = "2.7.36"
edition = "2021"
description = "Ajudante do AstraScreenShare: som sem o Discord, Não perturbe, teclas e desempenho"

# Crate independente (não faz parte do workspace do Tauri).
[workspace]

[[bin]]
name = "astra-audio"
path = "src/main.rs"

[dependencies]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "implement",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.58"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
